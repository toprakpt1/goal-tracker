<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Goal Tracker app icon">
  <!--
    Master source for the launcher icon. The mark geometry mirrors
    icon-mark.svg; update both files together.
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="46%">
      <stop offset="0%" stop-color="#F5A524" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#F5A524" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F5A524" stop-opacity="0"/>
